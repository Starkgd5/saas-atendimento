version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: saas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend-react/build:/usr/share/nginx/html
    depends_on:
      - backend-go
      - frontend
    networks:
      - saas-network
    restart: always

  mariadb:
    image: mariadb:10.11
    container_name: saas-mariadb-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups
    networks:
      - saas-network
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.2-alpine
    container_name: saas-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - saas-network
    restart: always

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.prod
    container_name: saas-backend-prod
    environment:
      - DB_DSN=${DB_USER}:${DB_PASSWORD}@tcp(mariadb:3306)/${DB_NAME}?parseTime=true
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - GIN_MODE=release
      - BASE_URL=${BASE_URL}
      - IA_URL=http://ia-service:8001
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
      - redis
      - ia-service
    networks:
      - saas-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile
    container_name: saas-ia-prod
    environment:
      - MODEL_PATH=/models/llama-2-7b.Q4_K_M.gguf
    volumes:
      - ./models:/models
    networks:
      - saas-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.prod
    container_name: saas-frontend-prod
    environment:
      - REACT_APP_API_URL=${BASE_URL}/api
    networks:
      - saas-network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: saas-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - saas-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: saas-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    networks:
      - saas-network
    restart: always

networks:
  saas-network:
    driver: bridge

volumes:
  mariadb_prod_data:
  redis_prod_data:
  prometheus_data:
  grafana_data: