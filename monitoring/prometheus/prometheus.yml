global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'saas-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-go:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend'

  - job_name: 'saas-ia'
    static_configs:
      - targets: ['ia-service:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ia'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-proxy:80']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'nginx'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  - job_name: 'mariadb'
    static_configs:
      - targets: ['mariadb:3306']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mariadb'

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']