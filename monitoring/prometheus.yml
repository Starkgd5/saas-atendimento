global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'saas-backend'
    static_configs:
      - targets: ['backend-go:8080']
    metrics_path: '/metrics'

  - job_name: 'saas-ia'
    static_configs:
      - targets: ['ia-service:8001']
    metrics_path: '/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']